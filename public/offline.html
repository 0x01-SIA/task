<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#416db5">
    <title>Task App Offline</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f7fb;
            --surface: rgba(255, 255, 255, 0.88);
            --text: #162033;
            --muted: #52607a;
            --accent: #416db5;
            --accent-strong: #305691;
            --border: rgba(65, 109, 181, 0.18);
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(15, 23, 42, 0.86);
                --text: #e5eefc;
                --muted: #a9b7cf;
                --accent: #6f95d7;
                --accent-strong: #8bace3;
                --border: rgba(143, 173, 227, 0.2);
                --shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, rgba(65, 109, 181, 0.25), transparent 42%),
                linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--bg) 88%, black));
            color: var(--text);
        }

        .offline-shell {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(65, 109, 181, 0.12);
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(2rem, 8vw, 2.5rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .offline-actions {
            margin-top: 24px;
        }

        button {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 18px 34px rgba(65, 109, 181, 0.28);
        }

        button:focus-visible {
            outline: 3px solid rgba(65, 109, 181, 0.35);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="offline-shell">
        <div class="offline-badge">Task App</div>
        <h1>You are offline</h1>
        <p>Task App needs an internet connection to load current jobs and save changes.</p>
        <div class="offline-actions">
            <button type="button" onclick="window.location.reload()">Try again</button>
        </div>
    </main>
</body>
</html>
